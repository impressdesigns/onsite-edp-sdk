[project]
name = "idi-onsite-edp-sdk"
version = "0.1.0"
description = "ShopWorks OnSite EDP generator"
authors = [
    { name = "Bradley Reynolds", email = "bradley.reynolds@impressdesigns.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.1"]

[project.optional-dependencies]
dev = [
    # DX
    "nox>=2026.10.20",
    "pre-commit>=4.7.0",
    # Linters
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]
docs = [
    "sphinx>=9.1.1",
    "furo>=2025.12.19",
    "sphinx-autoapi>=3.8.1",
    "releases>=2.1.1",
]
tests = ["pytest>=9.1.1", "pytest-randomly>=5.0.0", "coverage>=7.16.2"]

[project.urls]
repository = "https://github.com/impressdesigns/onsite-edp-sdk/"
documentation = "https://impressdesigns.dev/onsite-edp-sdk/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/onsite_edp_sdk"]

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # (Missing copyright notice at top of file) - No license
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/*" = [
    "INP001", # (File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.) - Docs are not modules
]
"tests/*" = [
    "S101",   # (Use of `assert` detected) - Yes, that's the point
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["onsite_edp_sdk"]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.uv]
# certifi 2026.10.19 is the release that distrusts the compromised eMudhra/emSign
# intermediates (October 2026); it is exempt from exclude-newer until it ages past the window.
constraint-dependencies = ["certifi>=2026.10.19"]
